[tools]
# Crystal is installed by mise. LLVM ships with Crystal's official distribution;
# SDL2 remains a system library because it must match the host window system.
crystal = "1.18.2"

[vars]
llvm_version = "15.0.7"
sdl2_version = "2.32.70"
sdl3_version = "3.4.12"

[tasks.format]
description = "Check Crystal source and spec formatting"
run = "crystal tool format --check src spec tools"

[tasks.format-fix]
description = "Apply Crystal formatting to source and specs"
run = "crystal tool format src spec tools"

[tasks.setup]
description = "Install managed tools and verify the required SDL2 development library"
run = "mise install && sdl2-config --version"

[tasks.spec]
description = "Run the headless test suite"
run = "crystal spec"

[tasks.test]
description = "Alias for the headless test suite"
depends = ["spec"]

[tasks.build]
description = "Build the optimized macOS app bundle"
run = "sh tools/build_macos_app.sh 'bin/Swanium Crystal.app' release"

[tasks.build-linux]
description = "Build the optimized Linux executable"
run = "sh tools/build_linux.sh bin/swanium-crystal"

[tasks.build-windows]
description = "Build the optimized Windows executable (requires an MSVC shell and SWANIUM_SDL2_DIR)"
run = "pwsh -NoProfile -File tools/build_windows.ps1 -Output bin/swanium-crystal.exe -Configuration release"

[tasks.package-windows]
description = "Create the Windows ZIP distribution"
depends = ["build-windows"]
run = "pwsh -NoProfile -Command \"$version = (Select-String '^version: *(.+)$' shard.yml).Matches[0].Groups[1].Value; $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'x86_64' }; & tools/package_windows.ps1 -Executable bin/swanium-crystal.exe -Output ('dist/Swanium-Crystal-{0}-windows-{1}.zip' -f $version,$arch)\""

[tasks.linux-native-probe]
description = "Verify SDL2 rendering inside a GTK3 X11 child window"
run = "sh tools/run_linux_native_probe.sh"

[tasks.linux-native-wayland-probe]
description = "Experimentally verify SDL3 rendering into a GTK3 Wayland surface"
run = "sh tools/run_linux_native_wayland_probe.sh"

[tasks.linux-sdl-smoke]
description = "Run the product GTK3 + SDL2 integration smoke test"
depends = ["build-linux"]
run = "sh tools/verify_linux_single_window.sh bin/swanium-crystal"

[tasks.linux-video-smoke]
description = "Run self-contained Linux video, input, and dummy-audio verification"
depends = ["build-linux"]
run = "SDL_AUDIODRIVER=dummy bin/swanium-crystal --video-smoke"

[tasks.linux-rom-smoke]
description = "Run generated horizontal and vertical ROMs through the complete Linux frontend"
depends = ["build-linux"]
run = "crystal run tools/run_linux_rom_smoke.cr -- bin/swanium-crystal"

[tasks.linux-keyboard-smoke]
description = "Inject an X11 key event and verify that SDL receives it"
depends = ["build-linux"]
run = "sh tools/verify_linux_keyboard.sh bin/swanium-crystal"

[tasks.linux-launcher-smoke]
description = "Verify the no-ROM launcher and window-manager close path"
depends = ["build-linux"]
run = "sh tools/verify_linux_launcher.sh bin/swanium-crystal"

[tasks.package-linux-deb]
description = "Create the Debian package"
depends = ["build-linux"]
run = "version=$(sed -n 's/^version: *//p' shard.yml | head -n 1) && sh tools/package_linux_deb.sh bin/swanium-crystal dist/swanium-crystal-${version}-linux-amd64.deb"

[tasks.package-linux-rpm]
description = "Create the RPM package (requires rpmbuild)"
depends = ["build-linux"]
run = "version=$(sed -n 's/^version: *//p' shard.yml | head -n 1) && sh tools/package_linux_rpm.sh bin/swanium-crystal dist/swanium-crystal-${version}-linux-x86_64.rpm"

[tasks.package-linux-appimage]
description = "Create AppImage (requires LINUXDEPLOY)"
depends = ["build-linux"]
run = "version=$(sed -n 's/^version: *//p' shard.yml | head -n 1) && sh tools/package_linux_appimage.sh bin/swanium-crystal dist/Swanium-Crystal-${version}-linux-x86_64.AppImage"

[tasks.build-debug]
description = "Build an unoptimized macOS app bundle for debugger work"
run = "sh tools/build_macos_app.sh 'bin/Swanium Crystal Debug.app' debug"

[tasks.package-macos]
description = "Create a ZIP archive from the optimized macOS app bundle"
depends = ["build"]
run = "version=$(plutil -extract CFBundleShortVersionString raw 'bin/Swanium Crystal.app/Contents/Info.plist') && sh tools/package_macos_app.sh 'bin/Swanium Crystal.app' \"dist/Swanium-Crystal-${version}-macos-$(uname -m).zip\""

[tasks.ci]
description = "Run the repository CI suite with self-contained fixtures only"
depends = ["format", "spec", "build", "headless-fixture", "sdl-smoke-ci"]

[tasks.check]
description = "Backward-compatible alias for the CI verification suite"
depends = ["ci"]

[tasks.sdl-smoke]
description = "Create an SDL2 window briefly (requires a desktop session)"
depends = ["build"]
run = "open -W 'bin/Swanium Crystal.app' --args --sdl-smoke"

[tasks.sdl-smoke-ci]
description = "Verify SDL2 initialization through its headless dummy video driver"
depends = ["build"]
run = "SDL_VIDEODRIVER=dummy 'bin/Swanium Crystal.app/Contents/MacOS/swanium-crystal' --sdl-smoke"

[tasks.headless-fixture]
description = "Run the built CLI against a generated, copyright-free cartridge fixture"
depends = ["build"]
run = "crystal run tools/run_headless_fixture.cr -- 'bin/Swanium Crystal.app/Contents/MacOS/swanium-crystal'"

[tasks.video-demo]
description = "Run the 60 fps video, input, audio, save-state, and debugger test"
run = "crystal run src/swanium.cr -- --video-demo"

[tasks.wscputest]
description = "Opt-in WSCPUTest headless diagnostic (requires WS_CPU_TEST_ROM)"
run = "crystal run tools/run_wscputest.cr"

[tasks.public-roms]
description = "Run source-confirmed public-ROM compatibility verification (requires the local Tests directory)"
run = "crystal run tools/run_public_roms.cr"
