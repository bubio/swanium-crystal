[tools]
# Crystal is installed by mise. LLVM ships with Crystal's official distribution;
# SDL2 remains a system library because it must match the host window system.
crystal = "1.18.2"

[vars]
llvm_version = "15.0.7"
sdl2_version = "2.32.70"

[tasks.format]
description = "Check Crystal source and spec formatting"
run = "crystal tool format --check src spec tools"

[tasks.format-fix]
description = "Apply Crystal formatting to source and specs"
run = "crystal tool format src spec tools"

[tasks.setup]
description = "Install managed tools and verify the required SDL2 development library"
run = "mise install && sdl2-config --version"

[tasks.spec]
description = "Run the headless test suite"
run = "crystal spec"

[tasks.test]
description = "Alias for the headless test suite"
depends = ["spec"]

[tasks.build]
description = "Build the command-line application"
run = "mkdir -p bin && crystal build src/swanium.cr -o bin/swanium-crystal"

[tasks.ci]
description = "Run the complete CI verification suite"
depends = ["format", "spec", "build"]

[tasks.check]
description = "Backward-compatible alias for the CI verification suite"
depends = ["ci"]

[tasks.sdl-smoke]
description = "Create an SDL2 window briefly (requires a desktop session)"
run = "crystal run src/swanium.cr -- --sdl-smoke"

[tasks.video-demo]
description = "Run the 60 fps video, input, audio, save-state, and debugger test"
run = "crystal run src/swanium.cr -- --video-demo"

[tasks.wscputest]
description = "Opt-in WSCPUTest headless diagnostic (requires WS_CPU_TEST_ROM)"
run = "crystal run tools/run_wscputest.cr"
