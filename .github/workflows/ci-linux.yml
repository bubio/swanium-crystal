name: CI Linux

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "spec/**"
      - "assets/**"
      - "tools/**"
      - "mise.toml"
      - "mise.lock"
      - "shard.yml"
      - "shard.lock"
      - ".github/workflows/ci-linux.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "spec/**"
      - "assets/**"
      - "tools/**"
      - "mise.toml"
      - "mise.lock"
      - "shard.yml"
      - "shard.lock"
      - ".github/workflows/ci-linux.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgtk-3-dev libssl-dev xvfb x11-utils xdotool rpm imagemagick
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          cache: true
      - name: Format, spec, and optimized Linux build
        run: |
          mise run format
          mise run spec
          mise run build-linux
      - name: Verify GTK3 X11 child-window rendering
        run: xvfb-run -a mise run linux-native-probe
      - name: Verify product SDL_CreateWindowFrom integration
        run: xvfb-run -a mise run linux-sdl-smoke
      - name: Verify product video, input polling, and audio queue
        run: xvfb-run -a mise run linux-video-smoke
      - name: Verify ROM loading, orientation, state, and cartridge persistence
        run: xvfb-run -a mise run linux-rom-smoke
      - name: Verify keyboard delivery to the SDL child wrapper
        run: xvfb-run -a mise run linux-keyboard-smoke
      - name: Verify no-ROM launcher and window-manager close
        run: xvfb-run -a mise run linux-launcher-smoke
      - name: Verify dynamic window-system dependencies
        run: |
          ldd bin/swanium-crystal | grep 'libSDL2-2.0.so.0'
          ldd bin/swanium-crystal | grep 'libgtk-3.so.0'
          ldd bin/swanium-crystal | grep 'libgdk-3.so.0'
      - name: Install pinned linuxdeploy
        env:
          LINUXDEPLOY_VERSION: 1-alpha-20251107-1
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        run: |
          tool="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          curl --fail --location --output "$tool" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  ${tool}" | sha256sum --check
          chmod +x "$tool"
          cd "$RUNNER_TEMP"
          "$tool" --appimage-extract >/dev/null
          echo "LINUXDEPLOY=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Package Linux distributions
        run: |
          mise run package-linux-deb
          mise run package-linux-rpm
          mise run package-linux-appimage
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swanium-crystal-linux-x86_64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
