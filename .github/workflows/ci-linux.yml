name: CI Linux

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "spec/**"
      - "tools/**"
      - "mise.toml"
      - "mise.lock"
      - "shard.yml"
      - "shard.lock"
      - ".github/workflows/ci-linux.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "spec/**"
      - "tools/**"
      - "mise.toml"
      - "mise.lock"
      - "shard.yml"
      - "shard.lock"
      - ".github/workflows/ci-linux.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgtk-3-dev libssl-dev xvfb x11-utils xdotool
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          cache: true
      - name: Format, spec, and optimized Linux build
        run: |
          mise run format
          mise run spec
          mise run build-linux
      - name: Verify GTK3 X11 child-window rendering
        run: xvfb-run -a mise run linux-native-probe
      - name: Verify product SDL_CreateWindowFrom integration
        run: xvfb-run -a mise run linux-sdl-smoke
      - name: Verify product video, input polling, and audio queue
        run: xvfb-run -a mise run linux-video-smoke
      - name: Verify ROM loading, orientation, state, and cartridge persistence
        run: xvfb-run -a mise run linux-rom-smoke
      - name: Verify keyboard delivery to the SDL child wrapper
        run: xvfb-run -a mise run linux-keyboard-smoke
      - name: Verify no-ROM launcher and window-manager close
        run: xvfb-run -a mise run linux-launcher-smoke
      - name: Verify dynamic window-system dependencies
        run: |
          ldd bin/swanium-crystal | grep 'libSDL2-2.0.so.0'
          ldd bin/swanium-crystal | grep 'libgtk-3.so.0'
          ldd bin/swanium-crystal | grep 'libgdk-3.so.0'
