name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "spec/**"
      - "tools/**"
      - "mise.toml"
      - "shard.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "spec/**"
      - "tools/**"
      - "mise.toml"
      - "shard.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runner uses Xcode 26, but release binaries must load on macOS 13.5+.
env:
  MACOSX_DEPLOYMENT_TARGET: "13.5"

jobs:
  check:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-26
          - arch: x86_64
            runs-on: macos-26-intel

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build SDL development libraries for macOS 13.5
        # Homebrew bottles built on macOS 26 carry a macOS 26 minimum version.
        # Build both SDL3 and its SDL2 compatibility library from source instead.
        run: brew install --build-from-source sdl3 sdl2
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          cache: true
      - name: Test and build optimized binary
        run: mise run ci
      - name: Verify binary and SDL2 linkage
        run: |
          file bin/swanium-crystal
          otool -l bin/swanium-crystal | awk '
            /LC_BUILD_VERSION/ { in_build_version = 1 }
            in_build_version && /minos 13\.5/ { found_target = 1 }
            END { exit !found_target }
          '
          otool -L bin/swanium-crystal | grep -i 'libSDL2'
          while IFS= read -r -d '' dylib; do
            otool -l "$dylib" | awk '
              /LC_BUILD_VERSION/ { in_build_version = 1 }
              in_build_version && /minos 13\.5/ { found_target = 1 }
              END { exit !found_target }
            '
          done < <(find "$(brew --prefix sdl3)" "$(brew --prefix sdl2)" -name '*.dylib' -print0)
          bin/swanium-crystal --version
      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: swanium-crystal-macos-${{ matrix.arch }}
          path: bin/swanium-crystal
          if-no-files-found: error
