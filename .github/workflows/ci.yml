name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development files (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          cache: true
      - run: mise run ci
