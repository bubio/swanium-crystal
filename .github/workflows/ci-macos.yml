name: CI macOS

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "spec/**"
      - "tools/**"
      - "mise.toml"
      - "mise.lock"
      - "shard.yml"
      - "shard.lock"
      - ".github/workflows/ci-macos.yml"
      - ".github/workflows/publish-release-assets.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "spec/**"
      - "tools/**"
      - "mise.toml"
      - "mise.lock"
      - "shard.yml"
      - "shard.lock"
      - ".github/workflows/ci-macos.yml"
      - ".github/workflows/publish-release-assets.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

# The runner uses Xcode 26, but release binaries must load on macOS 13.5+.
env:
  MACOSX_DEPLOYMENT_TARGET: "13.5"

jobs:
  test-and-bundle:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-26
          - arch: x86_64
            runs-on: macos-26-intel

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build pinned SDL releases for macOS 13.5
        # Fetch the official GitHub release sources, verify their SHA-256, and
        # build them for the deployment target instead of using Homebrew bottles.
        run: |
          prefix="$RUNNER_TEMP/swanium-sdl"
          sh tools/build_macos_sdl.sh "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SWANIUM_SDL2_LIBRARY=$prefix/lib/libSDL2-2.0.0.dylib" >> "$GITHUB_ENV"
          echo "SWANIUM_SDL3_LIBRARY=$prefix/lib/libSDL3.0.dylib" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          cache: true
      - name: Test and build optimized app bundle
        run: mise run ci
      - name: Verify app bundle and SDL2 linkage
        run: |
          app='bin/Swanium Crystal.app'
          executable="$app/Contents/MacOS/swanium-crystal"
          test -f "$app/Contents/Info.plist"
          test -f "$app/Contents/Frameworks/libSDL2-2.0.0.dylib"
          test -f "$app/Contents/Frameworks/libSDL3.dylib"
          version="$(sed -n 's/^version: *//p' shard.yml | head -n 1)"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" = "1"
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$executable"
          otool -l "$executable" | awk '
            /LC_BUILD_VERSION/ { in_build_version = 1 }
            in_build_version && /minos 13\.5/ { found_target = 1 }
            END { exit !found_target }
          '
          otool -L "$executable" | grep '@executable_path/../Frameworks/libSDL2'
          while IFS= read -r -d '' dylib; do
            otool -l "$dylib" | awk '
              /LC_BUILD_VERSION/ { in_build_version = 1 }
              in_build_version && /minos 13\.5/ { found_target = 1 }
              END { exit !found_target }
            '
          done < <(find "$RUNNER_TEMP/swanium-sdl/lib" -name '*.dylib' -print0)
          "$executable" --version
      - name: Prepare release archive
        if: github.event_name == 'release'
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw 'bin/Swanium Crystal.app/Contents/Info.plist')"
          mkdir -p dist
          sh tools/package_macos_app.sh 'bin/Swanium Crystal.app' "dist/Swanium-Crystal-${version}-macos-${{ matrix.arch }}.zip"
      - name: Prepare App Bundle artifact
        if: github.event_name != 'release'
        run: |
          artifact_dir="$RUNNER_TEMP/swanium-crystal-artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          ditto 'bin/Swanium Crystal.app' "$artifact_dir/Swanium Crystal.app"
      - name: Upload App Bundle artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: swanium-crystal-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/swanium-crystal-artifact/
          if-no-files-found: error
      - name: Upload release archive
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: swanium-crystal-macos-${{ matrix.arch }}
          path: dist/Swanium-Crystal-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: test-and-bundle
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      asset-patterns: |
        *.zip
